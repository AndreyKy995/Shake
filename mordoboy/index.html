<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Мордобой Тап</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen arcade app — menu (greeting, tabs, card grid, big CTA) and fight (HUD, arena canvas, energy, upgrades) */
:root{
  --bg:#170a2b; --bg2:#2a0f4a; --panel:#26143f; --panel2:#331b55; --line:#4a2c74; --ink:#fff4ea; --dim:#b9a6d6;
  --hot:#ff2e4d; --hot2:#ff7a2e; --gold:#ffc93c; --cyan:#33d6ff; --lime:#5cf08a;
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"PT Sans Narrow","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(120% 70% at 50% 0%,#4b1670 0%,var(--bg2) 35%,var(--bg) 75%);background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;box-sizing:border-box;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:var(--ink);background:var(--panel2);border:0;border-radius:12px;padding:7px 11px;cursor:pointer;box-shadow:0 3px 0 #120624}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #120624}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wallet{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);padding:4px 10px 4px 5px;border-radius:999px}
.pill.c{color:var(--gold)} .pill.s{color:var(--cyan)}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff1b0,var(--gold) 50%,#b07a0a);box-shadow:0 0 0 2px #7a5208 inset}
.star{width:20px;height:20px;background:var(--cyan);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}

/* меню */
.greet{font-family:var(--display);font-size:clamp(30px,9vw,46px);line-height:1;text-wrap:balance;margin:8px 0 0;
  background:linear-gradient(180deg,#fff27a 0%,var(--gold) 35%,var(--hot2) 65%,var(--hot) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #3a0820) drop-shadow(0 0 18px rgba(255,46,77,.45));transform:rotate(-2deg)}
.sub{color:var(--dim);font-size:15px;margin:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(0,0,0,.3);padding:4px;border-radius:14px}
.tabs button{font-family:var(--display);font-size:14px;letter-spacing:.03em;padding:9px;background:transparent;box-shadow:none;color:var(--dim)}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,var(--hot2),var(--hot));color:#fff;box-shadow:0 3px 0 #7a0a22}
.list{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;padding:2px 2px 6px}
.card{--c:var(--hot);display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));text-align:left;cursor:pointer;box-shadow:0 0 0 2px rgba(255,255,255,.04) inset,0 4px 0 #120624;position:relative}
.card.sel{box-shadow:0 0 0 3px var(--c) inset,0 0 22px -4px var(--c),0 4px 0 #120624}
.card canvas{width:100%;aspect-ratio:1;max-width:100%;border-radius:12px;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 70%,#fff 10%),color-mix(in srgb,var(--c) 30%,#12051f) 70%)}
.card .n{font-family:var(--display);font-size:15px;line-height:1.1}
.card .m{font-size:14px;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.card .m b{color:var(--ink);font-variant-numeric:tabular-nums}
.card .tag{position:absolute;top:12px;left:12px;font-family:var(--display);font-size:12px;background:rgba(0,0,0,.55);color:var(--gold);padding:2px 7px;border-radius:999px}
.card .buy{font-family:var(--display);font-size:13px;color:#06243a;background:linear-gradient(180deg,#8ae9ff,var(--cyan));padding:7px;box-shadow:0 3px 0 #0b6a8a}
.card .buy.gold{color:#3a2400;background:linear-gradient(180deg,#ffe28a,var(--gold));box-shadow:0 3px 0 #9a6a10}
.card.locked canvas{filter:grayscale(.75) brightness(.55)}
.go{font-family:var(--display);font-size:21px;padding:15px;color:#fff;background:linear-gradient(180deg,#ff6a3d,var(--hot));box-shadow:0 5px 0 #7a0a22,0 0 30px -6px var(--hot);letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.demo{font-family:var(--body);font-size:13px;white-space:nowrap;color:var(--cyan);background:rgba(0,0,0,.3);box-shadow:none;padding:5px 9px}

/* бой */
.timer{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:0 2px 0 #000}
.timer.low{color:var(--hot);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.timer.low{animation:none}}
.opp{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.opp .name{font-family:var(--display);font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp .cnt{font-size:14px;color:var(--dim);white-space:nowrap}
.opp .cnt b{color:var(--gold)}
.bar{position:relative;height:20px;border-radius:10px;background:rgba(0,0,0,.45);box-shadow:0 0 0 2px rgba(255,255,255,.06) inset;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .1s;border-radius:10px}
.bar i::after{content:"";position:absolute;inset:2px 6px auto;height:5px;border-radius:4px;background:rgba(255,255,255,.35)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.hp i{background:linear-gradient(90deg,#a3001f,var(--hot),var(--hot2))}
.hp.regen i{background:linear-gradient(90deg,#11803a,var(--lime))}
.en i{background:linear-gradient(90deg,#1956c9,var(--cyan))}
.stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:#12051f;box-shadow:0 0 0 2px rgba(255,255,255,.06) inset}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.chip{position:absolute;top:10px;left:10px;font-family:var(--display);font-size:12px;letter-spacing:.04em;color:#12051f;background:var(--gold);padding:4px 9px;border-radius:999px;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.combo{position:absolute;top:8px;right:12px;font-family:var(--display);font-size:22px;color:var(--gold);text-shadow:0 3px 0 #000,0 0 14px var(--hot2);pointer-events:none}
.status{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:var(--display);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.75);text-shadow:0 2px 0 #000;pointer-events:none}
.status.warn{color:var(--lime)}
.result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;background:radial-gradient(circle,rgba(120,10,60,.55),rgba(10,0,20,.75) 75%)}
.result strong{font-family:var(--display);font-size:clamp(36px,11vw,60px);line-height:1;color:var(--gold);text-shadow:0 4px 0 var(--hot),0 8px 0 #3a0820,0 0 30px #000;transform:rotate(-5deg)}
.result p{margin:0;font-size:17px;color:var(--ink);text-wrap:balance;max-width:30ch}
.result .btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.result .btns button{font-family:var(--display);font-size:15px;padding:11px 15px}
.result .btns .main{background:linear-gradient(180deg,#ff6a3d,var(--hot));box-shadow:0 4px 0 #7a0a22}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ups button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;text-align:left;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.ups .t{font-family:var(--display);font-size:14px}
.ups .s{font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
.ups .s b{color:var(--gold)}
</style>

</head><body>
<div class="app">
  <section class="view" id="menu">
    <div class="row">
      <div class="wallet"><span class="pill c"><span class="coin" aria-hidden="true"></span><b id="mCoins">0</b></span><span class="pill s"><span class="star" aria-hidden="true"></span><b id="mStars">0</b></span></div>
      <div class="wallet"><button class="demo" id="musM" type="button">♪ вкл</button><button class="demo" id="demoStars" type="button">+100 ★ тест</button></div>

    <div class="opp"><span class="name" id="oppName">—</span><span class="cnt">набито: <b id="oppCnt">0</b></span></div>

        <p id="resP"></p>
        <div class="btns"><button class="main" id="again" type="button">Ещё раз</button><button id="toMenu" type="button">Другой ебальник</button></div>
      </div>
    </div>
    <div class="bar en"><i id="enFill"></i><span id="enText"></span></div>

      <button id="upPow" type="button"><span class="t">Удар</span><span class="s" id="upPowS"></span></button>
      <button id="upEn" type="button"><span class="t">Выносливость</span><span class="s" id="upEnS"></span></button>
    </div>
  </section>
</div>

<script>
/* ===== Автообновление: если на сервере версия новее, грузим её мимо кэша ===== */
const GAME_VERSION = 9;
(function(){
  function check(){
    fetch(location.pathname + '?nocache=' + Date.now(), {cache:'no-store'})
      .then(r => r.text()).then(t => {
        const m = t.match(/const GAME_VERSION = (\d+);/);
        if (m && +m[1] > GAME_VERSION) location.replace(location.pathname + '?v=' + m[1]);
      }).catch(() => {});
  }
  check();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
})();
</script>

function noise(dur){ const b = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate), d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); const s=AC.createBufferSource(); s.buffer=b; return s; }

function hit(px, py){

  const wp = weapById(S.weapon);

  let [lx, ly] = toLocal(px, py);
  let best = 'nose', bd = 1e9;
  const RG = opp.reg, E = opp.ell;
  for (const k of REGK){ const d = Math.hypot(RG[k].x-lx, RG[k].y-ly); if (d < bd){ bd = d; best = k; } }

  const now = performance.now();

  const mult = 1 + Math.min(combo, 40)/20;
  const crit = Math.random() < .1;
  const dmg = Math.max(1, Math.round(power()*wp.mult*mult*(crit?2:1)));
  opp.hp = Math.max(0, opp.hp - dmg);
  S.coins += dmg;

  const add = dmg/opp.maxHp*4.2;
  for (const k of REGK){
    const d = Math.hypot(RG[k].x-RG[best].x, RG[k].y-RG[best].y);
    const f = k===best ? 1 : d < 80 ? .35 : d < 130 ? .1 : 0;
    opp.dmg[k] = Math.min(1, opp.dmg[k] + add*f);
  }
  const rd = opp.dmg[best];

  if (w > .05) faceSplat(lx, ly, Math.max(w, rd));
  const kick = (crit?11:7) * (1 + Math.min(1.2, wp.mult/12));
  rec.vx += dx*kick; rec.vy += dy*kick; rec.va += side*(crit?.09:.05)*(1+wp.blood);
  if (crit && !reduceMotion) shake = 10;
  weaponFX(wp, sx, sy, lx, ly, dx, dy, crit);
  if (reduceMotion) shake = 0;
  swings.push({sx:startX, sy:startY, tx:sx, ty:sy, t:0, side, w:wp.id});
  side = -side;
  floats.push({x:sx+rnd(-10,10), y:sy+10, txt:'-'+dmg, t:0, crit});
  sndHit(Math.max(w, rd), crit, wp.id); haptic(crit || wp.mult>=5 ? 'heavy' : 'medium');

    burst(W/2, 120, 'НОКАУТ!', '#ff2e4d', true);
    setTimeout(() => endFight(true), 1200);
  }
}

    for (const k of REGK){ const r = REG[k]; if (r.a===null) continue; const d = angDiff(th, r.a); b += o.dmg[k]*22*Math.exp(-d*d/.22); }
    for (const l of o.lumps){ const d = angDiff(th, l.a); b += l.s*w*Math.exp(-d*d/.04); }

}

function step(dt){

  }

    const d = drips[i]; d.y += d.vy; d.x += Math.sin(d.y*.12)*.15; d.life--; d.r *= .998;
    fg.fillStyle = `rgba(${140+Math.floor(Math.random()*30)},8,18,.9)`; fg.beginPath(); fg.arc(d.x+W/2, d.y+H/2, d.r, 0, 6.28); fg.fill();
    const E = opp.ell;
    if (((d.x-E.cx)/E.rx)**2 + ((d.y-E.cy)/(E.ry*.95))**2 > 1){ const [sx,sy] = toScreen(d.x, d.y); parts.push({x:sx,y:sy,vx:rec.vx*.3,vy:1,r:d.r,land:FLOOR+rnd(8,70),type:'b',cam:0}); drips.splice(i,1); }
    else if (d.life <= 0) drips.splice(i,1);
  }
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.vy += .32; p.x += p.vx; p.y += p.vy; p.vx *= .99;
    if (p.cam && --p.cam === 0){ screenSplat(p.x, p.y, rnd(18,42)); parts.splice(i,1); continue; }
    if (p.vy > 0 && p.y >= p.land){ floorStain(p.x, p.land, p.r, p.type); parts.splice(i,1); }
  }
  for (let i=debris.length-1;i>=0;i--){
    const p = debris[i]; p.life += dt; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .98; p.rot += p.vr;
    if ((p.kind==='shard' || p.kind==='splinter') && p.vy > 0 && p.y >= p.land){ floorStain(p.x, p.land, p.size, p.kind); debris.splice(i,1); continue; }
    if (p.life >= p.max) debris.splice(i,1);
  }
  for (let i=splats.length-1;i>=0;i--){ splats[i].a -= dt*.35; if (splats[i].a <= 0) splats.splice(i,1); }
  // кровь на лице и на полу постепенно стирается, чтобы видеть, как набивается лицо
  fadeT += dt;
  if (fadeT >= .25){
    fadeT = 0;
    for (const [L, half] of [[faceL, BLOOD_FACE_HALF], [floorL, BLOOD_FLOOR_HALF]]){
      const a = 1 - Math.pow(.5, .25/half);
      L.g.save(); L.g.setTransform(1,0,0,1,0,0); L.g.globalCompositeOperation = 'destination-out';
      L.g.fillStyle = `rgba(0,0,0,${a})`; L.g.fillRect(0,0,L.c.width,L.c.height); L.g.restore();
    }
  }
  for (let i=swings.length-1;i>=0;i--){ swings[i].t += dt/(swings[i].w==='fist'?.24:.32); if (swings[i].t >= 1) swings.splice(i,1); }
  for (let i=floats.length-1;i>=0;i--){ floats[i].t += dt; if (floats[i].t > .8) floats.splice(i,1); }
  for (let i=bursts.length-1;i>=0;i--){ bursts[i].t += dt; if (bursts[i].t > .55) bursts.splice(i,1); }
  for (let i=rings.length-1;i>=0;i--){ rings[i].t += dt; if (rings[i].t > rings[i].max) rings.splice(i,1); }
  shake *= .82;
}

/* ===== Интерфейс ===== */
const $ = id => document.getElementById(id);
function show(v){ $('menu').hidden = v !== 'menu'; $('fight').hidden = v !== 'fight'; if (v === 'fight') requestAnimationFrame(resize); }
function menuWallet(){ $('mCoins').textContent = Math.floor(S.coins).toLocaleString('ru-RU'); $('mStars').textContent = S.stars; }
function fightUI(regenOn){
  $('coins').textContent = Math.floor(S.coins).toLocaleString('ru-RU');
  const tl = Math.ceil(timeLeft); $('timer').textContent = '0:' + String(tl).padStart(2,'0'); $('timer').className = 'timer' + (tl <= 10 ? ' low' : '');
  $('oppName').textContent = opp.name; $('oppCnt').textContent = kos(opp.id);
  $('hpFill').style.width = (opp.hp/opp.maxHp*100) + '%'; $('hpText').textContent = Math.ceil(opp.hp) + ' / ' + opp.maxHp;
  $('hpBar').className = 'bar hp' + (regenOn ? ' regen' : '');
  if (mode === 'fight'){ $('status').textContent = regenOn ? 'Отдыхает, сука. Бей!' : 'Хуярь по ебалу'; $('status').className = 'status' + (regenOn ? ' warn' : ''); }
  $('enFill').style.width = (S.energy/enMax()*100) + '%'; $('enText').textContent = '⚡ ' + Math.floor(S.energy) + ' / ' + enMax();
  const mult = 1 + Math.min(combo,40)/20;
  $('combo').textContent = (combo > 2 && performance.now()-lastHit < 600) ? 'КОМБО ×' + mult.toFixed(2) : '';
  $('upPowS').innerHTML = `${power()} → ${power()+1} урона · <b>${powCost()}</b>`;
  $('upEnS').innerHTML = `+250 энергии · <b>${enCost()}</b>`;
  $('upPow').disabled = S.coins < powCost(); $('upEn').disabled = S.coins < enCost();
}

let tab = 'chars';
// персонажи открываются по очереди за золото: следующий доступен, когда открыт предыдущий
const prevChar = c => CHARS[CHARS.indexOf(c) - 1];
const canUnlock = c => { const p = prevChar(c); return !p || S.chars.includes(p.id); };
function buyBtn(it, isChar){
  if (!isChar) return `<button class="buy" type="button" ${S.stars < it.price ? 'disabled' : ''}>Купить · ${it.price} ★</button>`;
  if (!canUnlock(it)) return `<button class="buy gold" type="button" disabled>🔒 Сначала предыдущего</button>`;
  return `<button class="buy gold" type="button" ${S.coins < it.gold ? 'disabled' : ''}>Открыть · ${it.gold.toLocaleString('ru-RU')} 🪙</button>`;
}
function renderList(){
  const list = $('list'); list.innerHTML = '';
  const items = tab === 'chars' ? CHARS : WEAPONS;
  for (const it of items){
    const isChar = tab === 'chars';
    const owned = isChar ? S.chars.includes(it.id) : S.weapons.includes(it.id);
    const selected = isChar ? S.sel === it.id : S.weapon === it.id;
    const card = document.createElement('div');
    card.className = 'card' + (selected ? ' sel' : '') + (owned ? '' : ' locked');
    card.style.setProperty('--c', it.col);
    const meta = isChar
      ? `<span>набито: <b>${kos(it.id)}</b></span><span>HP <b>${Math.round(it.hp*Math.pow(1.25,kos(it.id)))}</b></span>`
      : `<span>${it.note}</span><span>урон <b>×${it.mult}</b></span>`;
    card.innerHTML = `<canvas width="240" height="240"></canvas>${!isChar && owned ? '' : ''}<div class="n">${it.name}</div><div class="m">${meta}</div>
      ${owned ? '' : buyBtn(it, isChar)}`;
    if (isChar && kos(it.id) >= 10){ const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = 'Постоянный клиент'; card.appendChild(tg); }
    const g = card.querySelector('canvas').getContext('2d');
    if (isChar){
      const o = makeOpp(it); const bruise = Math.min(.55, kos(it.id)*.05); REGK.forEach(k => o.dmg[k] = bruise);
      g.save(); g.scale(240/400, 240/400); g.translate(0, 30);
      if (o.sprite) drawSpriteChar(g, o, {x:200 - o.ell.cx, y:210 - o.ell.cy*.5, a:0}, null); else drawHead(g, o, {x:200, y:210, a:0}, null);
      g.restore();
    } else {
      g.fillStyle = 'rgba(255,255,255,.08)'; starPath(g, 120, 120, 100, 70, 12, 0); g.fill();
      drawWeapon(g, it.id, 120, 125, -0.5, it.id==='fist' ? 1.6 : 0.95);
    }
    card.onclick = e => {
      if (!owned){
        if (!e.target.closest('.buy')) return;
        if (isChar ? (canUnlock(it) && S.coins >= it.gold) : S.stars >= it.price){
          if (isChar) S.coins -= it.gold; else S.stars -= it.price;
          if (isChar){ S.chars.push(it.id); S.sel = it.id; } else { S.weapons.push(it.id); S.weapon = it.id; }
          save(); renderList();
        }
        return;
      }
      if (isChar) S.sel = it.id; else S.weapon = it.id;
      save(); renderList();
    };
    list.appendChild(card);
  }
  menuWallet();
  $('go').textContent = `Въебать: ${charById(S.sel).name} · ${weapById(S.weapon).name}`;
}
function setTab(t){ tab = t; $('tabChars').setAttribute('aria-selected', t==='chars'); $('tabWeap').setAttribute('aria-selected', t==='weap'); renderList(); }
$('tabChars').onclick = () => setTab('chars');
$('tabWeap').onclick = () => setTab('weap');
$('demoStars').onclick = () => { S.stars += 100; save(); renderList(); };
$('go').onclick = () => { audio(); startFight(); };
$('again').onclick = () => startFight();
$('toMenu').onclick = () => { mode = 'menu'; show('menu'); renderList(); };
$('back').onclick = () => { mode = 'menu'; show('menu'); renderList(); };
$('upPow').onclick = () => { const c = powCost(); if (S.coins >= c){ S.coins -= c; S.powLvl++; save(); } };
$('upEn').onclick = () => { const c = enCost(); if (S.coins >= c){ S.coins -= c; S.enLvl++; S.energy = enMax(); save(); } };

try { const tg = window.Telegram?.WebApp; if (tg){ tg.ready(); tg.expand(); } } catch(e){}
S.chars = S.chars.filter(id => charById(id));
CHARS.forEach(c => { if (c.gold === 0 && !S.chars.includes(c.id)) S.chars.push(c.id); });
if (!S.chars.includes(S.sel)) S.sel = CHARS[0].id;
if (!S.weapons.includes(S.weapon)) S.weapon = 'fist';
$('musM').onclick = e => { e.stopPropagation(); toggleMusic(); };
$('musF').onclick = e => { e.stopPropagation(); toggleMusic(); };
$('musM').addEventListener('pointerdown', e => e.stopPropagation());
$('musF').addEventListener('pointerdown', e => e.stopPropagation());
musLabels();
renderList(); show('menu'); requestAnimationFrame(frame);
if (document.fonts) document.fonts.ready.then(() => { buildArena(); if (mode === 'menu') renderList(); });
</script>
